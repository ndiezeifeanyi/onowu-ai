name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: personal_ai_os
          POSTGRES_PASSWORD: personal_ai_os
          POSTGRES_DB: personal_ai_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_ai_os" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt || python -m pip install pytest pytest-asyncio

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest -q
