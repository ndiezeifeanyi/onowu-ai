apiVersion: v1
kind: Namespace
metadata:
  name: personal-ai-os
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: personal-ai-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: europe-west1-docker.pkg.dev/PROJECT_ID/personal-ai-os/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: personal-ai-os-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: personal-ai-os
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: personal-ai-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: europe-west1-docker.pkg.dev/PROJECT_ID/personal-ai-os/backend:latest
          command: ["uv", "run", "celery", "-A", "app.workers.celery_app.celery_app", "worker", "-Q", "default,agents,research,scholarships,notifications,browser,reports", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: personal-ai-os-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: personal-ai-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: europe-west1-docker.pkg.dev/PROJECT_ID/personal-ai-os/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: https://api.example.com/api/v1
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: personal-ai-os
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000

