services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: personal_ai_os
      POSTGRES_PASSWORD: personal_ai_os
      POSTGRES_DB: personal_ai_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_ai_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://personal_ai_os:personal_ai_os@postgres:5432/personal_ai_os
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  celery-worker:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    command: ["uv", "run", "celery", "-A", "app.workers.celery_app.celery_app", "worker", "-Q", "default,agents,research,scholarships,notifications,browser,reports", "--loglevel=info"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://personal_ai_os:personal_ai_os@postgres:5432/personal_ai_os
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    depends_on:
      - backend

  celery-beat:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    command: ["uv", "run", "celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://personal_ai_os:personal_ai_os@postgres:5432/personal_ai_os
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - backend

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    profiles: ["offline"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  chroma_data:
  ollama_data:

