[project]
name = "personal-ai-os-backend"
version = "0.1.0"
description = "FastAPI backend for Personal AI OS"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15.0",
    "asyncpg>=0.30.0",
    "celery[redis]>=5.4.0",
    "chromadb>=0.6.3",
    "email-validator>=2.2.0",
    "fastapi[standard]>=0.115.8",
    "httpx>=0.28.1",
    "langchain>=0.3.18",
    "langchain-openai>=0.3.6",
    "langgraph>=0.2.73",
    "orjson>=3.10.15",
    "passlib[argon2]>=1.7.4",
    "pinecone>=6.0.0",
    "playwright>=1.50.0",
    "psycopg[binary]>=3.2.4",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.0",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "redis>=5.2.1",
    "sqlalchemy[asyncio]>=2.0.38",
    "structlog>=25.1.0",
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.9.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
